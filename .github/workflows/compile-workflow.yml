name: Compile Workflow

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Koharu mod (zip -> jar)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 1) หา/แตกซอร์ส: รองรับทั้ง ZIP ที่ root และอัปโหลดแบบแตกแล้ว
      - name: Locate and extract source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          WS="$GITHUB_WORKSPACE"
          cd "$WS"

          project_dir=""

          if [[ -f "$WS/gradlew" && -f "$WS/build.gradle" ]]; then
            project_dir="$WS"
            echo "Found extracted project at repo root."
          else
            shopt -s nullglob nocaseglob
            zips=( Koharu*.zip *.zip )
            shopt -u nocaseglob
            if [[ ${#zips[@]} -eq 0 ]]; then
              echo "::error::ไม่พบไฟล์ .zip ที่ root ของ repo - อัปโหลด Koharu-TrialRaid-ai50.zip ไว้หน้าแรกของ repo" >&2
              ls -la
              exit 1
            fi

            rm -rf "$WS/.ci-source"
            mkdir -p "$WS/.ci-source"

            for z in "${zips[@]}"; do
              echo "Checking zip: $z"
              if ! unzip -tq "$z" >/dev/null 2>&1; then
                echo "::warning::$z เสียหรืออ่านไม่ได้ ข้าม"
                continue
              fi
              if unzip -Z1 "$z" | grep -qE '(^/|(^|/)\.\.(/|$))'; then
                echo "::warning::$z มี path อันตราย ข้าม"
                continue
              fi
              if ! unzip -Z1 "$z" | grep -qE '(^|/)gradlew$'; then
                echo "::notice::$z ไม่มี gradlew ข้าม"
                continue
              fi
              unzip -q -o "$z" -d "$WS/.ci-source"
              break
            done

            wrapper="$(find "$WS/.ci-source" -maxdepth 4 -type f -name gradlew 2>/dev/null | head -n 1 || true)"
            if [[ -z "$wrapper" ]]; then
              echo "::error::แตกซิปแล้วไม่พบ gradlew - ซิปอาจไม่ครบ" >&2
              find "$WS/.ci-source" -maxdepth 3 | head -50 || true
              exit 1
            fi
            project_dir="$(dirname "$wrapper")"
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Selected project directory: $project_dir"

      # 2) เช็คไฟล์จำเป็นให้ครบก่อนบิลด์
      - name: Pre-flight checks
        shell: bash
        working-directory: ${{ steps.src.outputs.project_dir }}
        run: |
          set -uo pipefail
          missing=0
          need=(
            build.gradle settings.gradle gradle.properties
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
            src/main src/client
            anubis/build.gradle anubis/src/main/resources/fabric.mod.json
            src/main/resources/fabric.mod.json
            third_party/baritone/src
          )
          for p in "${need[@]}"; do
            if [[ -e "$p" ]]; then echo "OK    $p"; else echo "::error::MISSING $p"; missing=1; fi
          done
          if [[ $missing -ne 0 ]]; then
            echo "::error::ไฟล์โปรเจกต์ไม่ครบ - ซิปอาจถูกตัดหรืออัปโหลดไม่สมบูรณ์"
            exit 1
          fi
          chmod +x ./gradlew
          echo "--- gradle.properties ---"
          cat gradle.properties
          java -version 2>&1

      - name: Verify Anubis import (warning only)
        shell: bash
        working-directory: ${{ steps.src.outputs.project_dir }}
        run: |
          if [[ -f tools/verify_anubis_full_import.py ]]; then
            python3 tools/verify_anubis_full_import.py || echo "::warning::Anubis verify script reported a mismatch (ไม่บล็อกการบิลด์)"
          else
            echo "No verify script, skipping."
          fi

      # 3) คอมไพล์ (ลองซ้ำ 3 รอบ กันเน็ต/maven สะดุด)
      - name: Compile mod JAR
        shell: bash
        working-directory: ${{ steps.src.outputs.project_dir }}
        run: |
          set -uo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "=========== Build attempt $attempt/3 ==========="
            if ./gradlew build -x test --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build-$attempt.log"; then
              ok=1; break
            fi
            if grep -qE "error: |cannot find symbol|COMPILATION ERROR|Execution failed for task ':(compile|anubis:compile)" "$RUNNER_TEMP/build-$attempt.log" \
               && ! grep -qiE "Could not (resolve|GET|HEAD)|timed out|Connection reset|UnknownHost|502|503" "$RUNNER_TEMP/build-$attempt.log"; then
              echo "::error::มี error ในโค้ด (ไม่ใช่ปัญหาเน็ต) หยุดลองซ้ำ"
              break
            fi
            sleep 20
          done

          if [[ $ok -ne 1 ]]; then
            echo "================ สรุป error ================"
            grep -hE "error:|FAILED|What went wrong|Could not|cannot find symbol" -A3 "$RUNNER_TEMP"/build-*.log | head -80 || true
            exit 1
          fi

      - name: Run unit tests (non-blocking)
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.src.outputs.project_dir }}
        run: ./gradlew test --no-daemon --stacktrace --console=plain

      # 4) เช็คไฟล์ JAR ที่ได้
      - name: Collect and validate JAR
        shell: bash
        working-directory: ${{ steps.src.outputs.project_dir }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.ci-artifacts"
          rm -rf "$out"; mkdir -p "$out"

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' | sort)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "::error::บิลด์ผ่านแต่ไม่พบ JAR ใน build/libs"
            ls -la build/libs || true
            exit 1
          fi

          for j in "${jars[@]}"; do
            echo "Validating $j"
            unzip -tq "$j" >/dev/null || { echo "::error::$j เสีย"; exit 1; }
            unzip -l "$j" | grep -q "fabric.mod.json" || { echo "::error::$j ไม่มี fabric.mod.json"; exit 1; }
            unzip -l "$j" | grep -q "META-INF/jars/anubisplus" || echo "::warning::$j ไม่มี Anubis ฝังอยู่ข้างใน"
            size=$(stat -c%s "$j")
            if [[ $size -lt 100000 ]]; then echo "::error::$j เล็กผิดปกติ ($size bytes)"; exit 1; fi
            cp "$j" "$out/"
          done

          (cd "$out" && sha256sum *.jar > SHA256SUMS.txt && ls -lh)

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Koharu-Minecraft-Mod-JAR
          path: .ci-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Koharu-Build-Diagnostics
          path: |
            .ci-source/**/build/reports/
            .ci-source/**/build/test-results/
            build/reports/
            ${{ runner.temp }}/build-*.log
          if-no-files-found: ignore
          retention-days: 7
